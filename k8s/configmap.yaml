# Non-secret configuration only. DATABASE_URL lives in a Secret (see secret.example.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: eaze-level-up-config
  namespace: eaze
data:
  PORT: "3000"
  DB_SSL: "false"
  DB_POOL_MAX: "10"
  EAZE_COINS_API_URL: "https://api.eazeapp.com/payments/free-coins/upload/"
  REDASH_BASE_URL: "https://analytics.getlokalapp.com"
  REDASH_PHONE_QUERY_ID: "20342"
  REDASH_PHONE_COLUMN: "mobile_no"
