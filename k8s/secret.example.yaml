# Template only — do not commit a filled-in copy of this file.
# Create the real secret out-of-band instead, e.g.:
#   kubectl create secret generic eaze-level-up-secrets \
#     --namespace eaze \
#     --from-literal=DATABASE_URL='postgresql://user:pass@host:5432/db' \
#     --from-literal=EAZE_COINS_AUTH_KEY='<real x-n8n-auth-key value>'
# or via your cluster's secrets manager (External Secrets, Sealed Secrets, etc).
#
# EAZE_COINS_AUTH_KEY gates the real coin transfer (see
# app/services/coin_transfer.py) — without it, every claim silently succeeds
# in mock mode without actually crediting coins. It must be set for claims
# to do anything real in prod.
apiVersion: v1
kind: Secret
metadata:
  name: eaze-level-up-secrets
  namespace: eaze
type: Opaque
stringData:
  DATABASE_URL: "postgresql://app_user:app_password@postgres:5432/app_db"
  EAZE_COINS_AUTH_KEY: "<real x-n8n-auth-key value>"
