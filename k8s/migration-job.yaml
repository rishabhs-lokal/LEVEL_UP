# Runs `python scripts/migrate.py up` to completion, then exits — the
# Kubernetes-native way to run a task exactly once per deploy, ahead of the
# Deployment rollout.
#
# Jobs are immutable once created, so a fresh deploy must delete the previous
# run first (see scripts/deploy.sh):
#   kubectl delete job/eaze-level-up-migrate -n eaze --ignore-not-found
#   kubectl apply -f k8s/migration-job.yaml
#   kubectl wait --for=condition=complete job/eaze-level-up-migrate -n eaze --timeout=120s
apiVersion: batch/v1
kind: Job
metadata:
  name: eaze-level-up-migrate
  namespace: eaze
  labels:
    app: eaze-level-up
    role: migrate
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: eaze-level-up
        role: migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: migrate
          image: ghcr.io/OWNER/eaze-level-up:latest   # must match the image being deployed
          imagePullPolicy: IfNotPresent
          command: ["python", "scripts/migrate.py", "up"]
          envFrom:
            - configMapRef:
                name: eaze-level-up-config
            - secretRef:
                name: eaze-level-up-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
